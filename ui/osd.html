<!doctype html>
<html lang="pt-BR" data-theme="algodao">
<head>
<meta charset="utf-8">
<title>Mixi</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 14px 20px 22px; display: flex; justify-content: center; }
  .osd {
    width: 300px; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px 12px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 22px;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(10px) scale(.98);
  }
  .osd.show { animation: osd-in .2s cubic-bezier(.2, .9, .3, 1.2) forwards; }
  @keyframes osd-in { to { opacity: 1; transform: none; } }
  .osd .tile { background: var(--soft); color: var(--ink); }
  .osd.alert .tile { background: var(--accent); color: var(--on-accent); }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .title { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { font-size: 12px; font-weight: 700; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .15s ease; }
</style>
</head>
<body>
<div id="osd" class="osd" role="status" aria-live="polite">
  <div id="icon" class="tile" aria-hidden="true"></div>
  <div class="text">
    <div id="title" class="title"></div>
    <div id="detail" class="detail"></div>
    <div id="bar" class="bar" hidden><i id="fill"></i></div>
  </div>
</div>
<script>
'use strict';
const P = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICONS = {
  'mic': P('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  'mic-off': P('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path d="M4 4l16 16"/>'),
  'volume': P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/>'),
  'volume-off': P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
  'headphones': P('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/>'),
  'speakers': P('<rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7.5" r="1"/>'),
  'display': P('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>'),
  'mode': P('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
  'other': P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/>'),
};
const $ = (id) => document.getElementById(id);

window.__TAURI__.event.listen('osd', ({ payload: o }) => {
  document.documentElement.dataset.theme = localStorage.getItem('mixi.theme') || 'algodao';
  $('icon').innerHTML = ICONS[o.icon] || ICONS.other;
  $('title').textContent = o.title;
  $('detail').textContent = o.detail;
  $('detail').hidden = !o.detail;
  $('bar').hidden = o.value == null;
  if (o.value != null) $('fill').style.width = Math.round(o.value * 100) + '%';
  const box = $('osd');
  box.classList.toggle('alert', !!o.alert);
  box.classList.remove('show');
  void box.offsetWidth; // reinicia a animação de entrada
  box.classList.add('show');
});
</script>
</body>
</html>
