<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4F9"/>
      <stop offset="0.55" stop-color="#F6EEFB"/>
      <stop offset="1" stop-color="#EAF6F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8679F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8679F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1.6" fill="#F2DAE6"/>
      <circle cx="22" cy="24" r="1.2" fill="#E4DDF3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#B04878" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#dots)"/>
  <circle cx="226" cy="168" r="200" fill="url(#glow)"/>

  <!-- painel em miniatura -->
  <g filter="url(#shadow)">
    <rect x="84" y="46" width="284" height="248" rx="30" fill="#FFF8FB" stroke="#F2DAE6" stroke-width="2"/>
  </g>
  <!-- mascote -->
  <g transform="translate(104 58) scale(1.5)">
    <path d="M8 27 C8 7, 40 7, 40 27" fill="none" stroke="#A3326B" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="10" y="13" width="28" height="29" rx="13" fill="#E8679F"/>
    <rect x="4" y="23" width="8" height="13" rx="4" fill="#A3326B"/>
    <rect x="36" y="23" width="8" height="13" rx="4" fill="#A3326B"/>
    <circle cx="19.5" cy="26" r="2.4" fill="#2B1D2F"/>
    <circle cx="28.5" cy="26" r="2.4" fill="#2B1D2F"/>
    <ellipse cx="16" cy="31.5" rx="2.8" ry="1.8" fill="#FFC4DC"/>
    <ellipse cx="32" cy="31.5" rx="2.8" ry="1.8" fill="#FFC4DC"/>
    <path d="M21.5 31 q2.5 2.6 5 0" fill="none" stroke="#2B1D2F" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="186" y="104" fill="#3A2A3F" font-family="Fredoka, Nunito, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600">Mixi</text>
  <!-- barrinhas "tocando" -->
  <g fill="#E8679F">
    <rect x="262" y="88" width="5" height="14" rx="2.5"/>
    <rect x="270" y="80" width="5" height="22" rx="2.5"/>
    <rect x="278" y="92" width="5" height="10" rx="2.5"/>
  </g>
  <!-- linhas de apps -->
  <g>
    <rect x="102" y="140" width="248" height="42" rx="14" fill="#FFFFFF" stroke="#F2DAE6" stroke-width="1.5"/>
    <rect x="112" y="149" width="24" height="24" rx="8" fill="#CDF3DA"/>
    <rect x="148" y="158" width="150" height="7" rx="3.5" fill="#FBE2EE"/>
    <rect x="148" y="158" width="104" height="7" rx="3.5" fill="#E8679F"/>
    <circle cx="252" cy="161.5" r="7" fill="#FFFFFF" stroke="#E8679F" stroke-width="3"/>
    <rect x="312" y="150" width="28" height="22" rx="8" fill="#FBE2EE"/>

    <rect x="102" y="190" width="248" height="42" rx="14" fill="#FFFFFF" stroke="#F2DAE6" stroke-width="1.5"/>
    <rect x="112" y="199" width="24" height="24" rx="8" fill="#DCE0FF"/>
    <rect x="148" y="208" width="150" height="7" rx="3.5" fill="#FBE2EE"/>
    <rect x="148" y="208" width="58" height="7" rx="3.5" fill="#E8679F"/>
    <circle cx="206" cy="211.5" r="7" fill="#FFFFFF" stroke="#E8679F" stroke-width="3"/>
    <rect x="312" y="200" width="28" height="22" rx="8" fill="#FBE2EE"/>

    <rect x="102" y="240" width="248" height="42" rx="14" fill="#FFFFFF" stroke="#F2DAE6" stroke-width="1.5"/>
    <rect x="112" y="249" width="24" height="24" rx="8" fill="#FFE6BF"/>
    <rect x="148" y="258" width="150" height="7" rx="3.5" fill="#FBE2EE"/>
    <rect x="148" y="258" width="132" height="7" rx="3.5" fill="#E8679F"/>
    <circle cx="280" cy="261.5" r="7" fill="#FFFFFF" stroke="#E8679F" stroke-width="3"/>
    <rect x="312" y="250" width="28" height="22" rx="8" fill="#E8679F"/>
  </g>

  <!-- título -->
  <text x="450" y="150" fill="#3A2A3F" font-family="Fredoka, Nunito, 'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="600" letter-spacing="-1">Mixi</text>
  <text x="454" y="200" fill="#6A5470" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="600">O volume de cada app, a um clique na bandeja.</text>
  <text x="454" y="238" fill="#C24E86" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="2">WINDOWS 10/11  ·  VOLUME POR APP  ·  TROCA DE SAÍDA  ·  6 TEMAS</text>

  <!-- bolinhas dos temas -->
  <g>
    <rect x="454" y="268" width="760" height="4" rx="2" fill="#E8679F" opacity="0.85"/>
    <circle cx="1132" cy="300" r="11" fill="#E8679F"/>
    <circle cx="1162" cy="300" r="11" fill="#3DBE8B"/>
    <circle cx="1192" cy="300" r="11" fill="#A99BFF" stroke="#211D33" stroke-width="4"/>
    <circle cx="1222" cy="300" r="11" fill="#F4904F"/>
  </g>
</svg>
